name: Release

on:
  push:
    tags: ["v*"]
  # 失败后不需要删 tag 重打：到 Actions 页面选中该 tag 手动重跑即可。
  workflow_dispatch:

permissions:
  contents: write

# 同一 tag 的发布串行执行，不互相取消，避免并发写同一个 Release / 重复发布。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # 直接复用 ci.yml，tag 发布前必须先通过同一套构建/测试/lint。
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  verify:
    name: Verify tag matches Cargo.toml version
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Must be triggered on a version tag
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) ;;
            *)
              echo "::error::请在 Actions 页面选择 v* tag 作为 ref 运行（当前为 $GITHUB_REF）"
              exit 1
              ;;
          esac

      - name: Tag must match Cargo.toml version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          echo "tag=$tag version=$version"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${version}"
            exit 1
          fi

  # 纯 Rust 库没有可执行文件，唯一的分发物就是 crates.io 上的 crate。
  publish-crate:
    name: Publish to crates.io
    needs: [ci, verify]
    runs-on: ubuntu-latest
    environment: crates-io

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check whether this version is already on crates.io
        id: check
        run: |
          crate="$(grep -m1 '^name' Cargo.toml | cut -d'"' -f2)"
          version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          code="$(curl -s -o /dev/null -w '%{http_code}' -A 'rsedlib-release-workflow' \
            "https://crates.io/api/v1/crates/${crate}/${version}")"
          echo "crates.io ${crate}@${version} -> HTTP ${code}"
          if [ "$code" = "200" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${crate} ${version} 已发布过，跳过 cargo publish"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Dry run
        if: steps.check.outputs.published == 'false'
        run: cargo publish --locked --dry-run

      - name: Publish
        if: steps.check.outputs.published == 'false'
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  github-release:
    name: Publish GitHub Release
    needs: publish-crate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & build artifacts
        uses: Swatinem/rust-cache@v2

      # 附带与 crates.io 完全一致的 .crate 包及校验和，便于离线/可复现使用。
      - name: Package crate and checksum
        run: |
          crate="$(grep -m1 '^name' Cargo.toml | cut -d'"' -f2)"
          version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          cargo package --locked
          mkdir -p dist
          cp "target/package/${crate}-${version}.crate" dist/
          (cd dist && sha256sum "${crate}-${version}.crate" > "${crate}-${version}.crate.sha256")

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # 显式指定 tag，重跑时会更新已有 Release 而不是新建
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
